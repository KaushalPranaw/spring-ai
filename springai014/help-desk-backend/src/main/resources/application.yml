server:
  port: 8081

spring:
  application:
    name: "help-desk-backend"
  # DB Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/spring-ai?useSSL=false&serverTimezone=UTC
    username: postgres
    password: root
  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

  #open-ai key set
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor:
                SimpleLoggerAdvisor: DEBUG
    com:
      substring:
        helpdesk:
          tools: DEBUG
